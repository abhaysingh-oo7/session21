{{- if and .Values.monitoring .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "taskboard.fullname" . }}-backend
  labels:
    app.kubernetes.io/component: backend
    {{- include "taskboard.labels" . | nindent 4 }}
    {{- if .Values.monitoring.labels }}
    {{- toYaml .Values.monitoring.labels | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
      app.kubernetes.io/name: {{ include "taskboard.name" . }}-backend
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.interval | default "15s" }}
{{- end }}
