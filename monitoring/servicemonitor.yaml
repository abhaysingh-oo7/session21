apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: taskboard-backend-monitor
  namespace: taskboard
  labels:
    app.kubernetes.io/name: taskboard-backend
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
      app.kubernetes.io/name: taskboard-backend
  namespaceSelector:
    matchNames:
      - taskboard
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
