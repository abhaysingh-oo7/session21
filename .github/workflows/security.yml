name: TaskBoard Security Audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install bandit pip-audit

      - name: SAST - Bandit Code Scan
        run: bandit -r backend/app/ --skip B104

      - name: SCA - pip-audit Dependency Scan
        run: pip-audit -r backend/requirements.txt

      - name: Secret Scan - Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

      - name: Build backend container for scanning
        run: docker build -t taskboard-backend:${{ github.sha }} ./backend

      - name: Container Vulnerability Scan - Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: taskboard-backend:${{ github.sha }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
