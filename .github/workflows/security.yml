name: Session 21 Security

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r application/requirements.txt

      - name: SAST - Bandit
        run: |
          pip install bandit
          bandit -r application --skip B104

      - name: SCA - pip-audit
        run: |
          pip install pip-audit
          pip-audit -r application/requirements.txt

      - name: Secret Scan - Gitleaks
        uses: gitleaks/gitleaks-action@v2

      - name: Build image
        run: docker build -f docker/Dockerfile -t session21-security:${{ github.sha }} .

      - name: Container Scan - Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: session21-security:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
